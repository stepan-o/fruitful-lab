name: Review Security event screens
on:
  push:
    branches: [codex/ui-security-study-verification]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/review" playwright@1.56.1
      - run: "$RUNNER_TEMP/review/node_modules/.bin/playwright install --with-deps chromium"
      - run: mkdir -p screens && NODE_PATH="$RUNNER_TEMP/review/node_modules" node .github/security-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-event-frames
          path: screens
