name: Verify Forge review
on:
  push:
    branches: [codex/ui-forge-study]
    paths: ['.github/workflows/forge-study-capture.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/forge-review" playwright@1.56.1
      - run: "$RUNNER_TEMP/forge-review/node_modules/.bin/playwright install chromium"
      - name: Check desktop and phone reading modes
        run: |
          python -m http.server 4173 --directory apps/lab/public >/tmp/forge-study-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4173/loopforge-design/forge-study/index.html >/dev/null && break; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/forge-review/node_modules" node docs/loopforge/game-design/forge-study/check-review.cjs http://127.0.0.1:4173
