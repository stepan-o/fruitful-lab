name: Prepare Forge study evidence
on:
  push:
    branches: [codex/ui-forge-study]
    paths: ['.github/workflows/forge-study-capture.yml']
permissions:
  actions: read
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
        state: [wait, sent, after]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forge-ui-evidence
          run-id: 44873804988
          github-token: ${{ github.token }}
          path: captures
      - name: Export the review-sized still and measured bounds
        env:
          DEVICE: ${{ matrix.device }}
          STATE: ${{ matrix.state }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os
          from pathlib import Path
          root=Path('captures')
          device,state=os.environ['DEVICE'],os.environ['STATE']
          jpg=next(root.rglob(f'{device}-{state}.jpg'))
          content=jpg.read_bytes()
          print('MEASURE='+json.dumps(json.loads(next(root.rglob(device+'.json')).read_text())))
          print('SHA256='+hashlib.sha256(content).hexdigest())
          for offset in range(0,len(content),1500):
              print('IMAGEDATA='+base64.b64encode(content[offset:offset+1500]).decode())
          PY
