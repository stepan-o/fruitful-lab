[package]
name = "loopforge-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.28"
