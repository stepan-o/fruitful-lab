name: Check live access and the offline review floor
on:
  push:
    branches: [codex/days-2-4-engine]
    paths:
      - '.github/workflows/loopforge-shifts-live.yml'
      - 'apps/lab/public/loopforge-shifts/**'
      - 'apps/lab/scripts/shifts/portable*'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Compare hosted files with the reviewed tree
        env:
          PREVIEW: https://fruitful-lab-git-codex-days-2-4-engine-stepan-oskins-projects.vercel.app
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          root = Path('apps/lab/public/loopforge-shifts')
          files = ['index.html', 'floor.css', 'viewer.js', 'kernel.js', 'ENGINE-HANDOFF.md', 'fixtures/index.json']
          files += [str(p.relative_to(root)) for p in sorted((root / 'fixtures').glob('*.json')) if p.name != 'index.json']
          origin = os.environ['PREVIEW']
          for attempt in range(40):
              for name in files:
                  url = origin + '/loopforge-shifts/' + name
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  try:
                      with urllib.request.urlopen(request, timeout=10) as response:
                          payload = response.read()
                          if response.url.startswith('https://vercel.com/') or response.status in (401, 403):
                              print('::notice::Vercel requires sign-in. The public request reached the access gate.'); raise SystemExit(0)
                  except urllib.error.HTTPError as error:
                      if error.code in (401, 403):
                          print('::notice::Vercel requires sign-in. The public request reached the access gate.'); raise SystemExit(0)
                      print(name, error.code, flush=True)
                      break
                  except urllib.error.URLError as error:
                      print(name, str(error.reason), flush=True)
                      break
                  if payload != (root / name).read_bytes():
                      print('Waiting for reviewed bytes at', name, flush=True)
                      break
                  print(name, hashlib.sha256(payload).hexdigest()[:12], flush=True)
              else:
                  print('Verified', len(files), 'live files at', origin + '/loopforge-shifts/index.html')
                  break
              time.sleep(20)
          else:
              raise SystemExit('Deployment did not serve the reviewed bytes')
          PY
      - name: Open the standalone player with the network disabled
        run: |
          python3 apps/lab/scripts/shifts/portable.py "$RUNNER_TEMP/floor"
          npm install --prefix "$RUNNER_TEMP/offline-review" playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome)" NODE_PATH="$RUNNER_TEMP/offline-review/node_modules" node apps/lab/scripts/shifts/portable-check.cjs "$RUNNER_TEMP/floor/Loopforge-Days-2-4.html"
      - uses: actions/upload-artifact@v4
        with:
          name: playable-opening-shifts-with-fixtures
          path: ${{ runner.temp }}/floor/Loopforge-Days-2-4-review.zip
          retention-days: 30
