name: Attach staffing decisions to PR 177
on:
  push:
    branches: [codex/loopforge-first-playthrough]
    paths: ['.github/workflows/loopforge-attach-177.yml']
permissions:
  contents: write
  actions: read
jobs:
  clips:
    if: github.repository == 'stepan-o/fruitful-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/loopforge-first-playthrough
      - name: Wait for the updated 320 px recording
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44809706834/jobs" --jq '.jobs[] | select(.name=="screen (stiletto)") | .conclusion // ""')
            if [ "$result" = success ]; then exit 0; fi
            if [ -n "$result" ]; then exit 1; fi
            sleep 20
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          run-id: 44809706834
          name: loopforge-stiletto-1x
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/captures
      - name: Bind the two successful recordings to the owner review page
        env:
          OUT: apps/lab/public/loopforge-shifts/review/first-playthrough
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          src="$RUNNER_TEMP/captures/stiletto"
          for clip in opening-issue-daily-pass recovery-recover-Wash; do
            test -s "$src/$clip.mp4"
            cp "$src/$clip.mp4" "$OUT/stiletto/"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$OUT"
          git rm -- .github/workflows/loopforge-attach-177.yml
          git commit -m 'Add close-ups of the daily pass and kit physically taking Wash'
          git push origin HEAD:refs/heads/codex/loopforge-first-playthrough
