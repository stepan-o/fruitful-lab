<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Phone review · Missing ID · Loopforge</title><link rel="stylesheet" href="event.css"><style>
body{padding:20px clamp(8px,3vw,44px)}header,main{max-width:890px;margin:0 auto}header h1{font-size:clamp(32px,5vw,48px);margin:.4em 0}header a{display:inline-flex;align-items:center;min-height:44px}nav{display:flex;gap:20px}nav [aria-current]{color:var(--lamp);font-weight:bold}main{display:flex;gap:30px;flex-wrap:wrap;align-items:start}figure{max-width:100%;margin:0}figcaption{font:700 13px/1.6 var(--mono);color:var(--lamp);margin:10px 0}iframe{display:block;max-width:100%;background:#192520;border:0;box-shadow:0 0 0 1px #747b67}
</style></head><body><header><a href="index.html">← Security event study</a><h1>Phone review</h1><nav aria-label="Compare both phones"><a href="#watch">Security camera</a><a href="#case">Opened event</a></nav></header><main><figure><figcaption>390 × 844</figcaption><iframe width="390" height="844" title="390 pixel phone case preview" src="index.html#case"></iframe></figure><figure><figcaption>320 × 693</figcaption><iframe width="320" height="693" title="320 pixel phone case preview" src="index.html#case"></iframe></figure></main>
<script>
function compare() {
  const view = location.hash === '#watch' ? '#watch' : '#case';
  for (const link of document.querySelectorAll('nav a')) {
    if (link.hash === view) link.setAttribute('aria-current','true');
    else link.removeAttribute('aria-current');
  }
  for (const frame of document.querySelectorAll('iframe')) {
    frame.src = 'index.html' + view;
  }
}
window.addEventListener('hashchange',compare);
compare();
</script></body></html>
