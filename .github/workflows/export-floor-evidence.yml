name: Export the approved-scope shifts review media
on:
  push:
    branches: [codex/shifts-raking-player]
    paths: ['.github/workflows/export-floor-evidence.yml']
permissions: {}
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: read
      contents: write
    steps:
      - name: Package the completed capture as Git media objects
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 44596096042 --name raking-floor-gameplay --dir footage
          cd footage
          test "$(jq -r .after runs.json)" = 13dedce79122bd12d83cdbebb535a00c2483b331
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          mkdir -p ../delivery
          for width in 1280 320; do
            for phase in before after; do
              if [[ "$phase" == before ]]; then sha=73658a93; else sha=13dedce7; fi
              if [[ "$width" == 320 ]]; then view="320x740 touch emulation"; else view="1280x860 desktop"; fi
              printf '%s\n' "$phase $sha | $view | 1x" 'Missing ID / Security > Conveyor chat / Conveyor' > caption.txt
              ffmpeg -v error -i "$phase-$width.webm" -vf "pad=iw:ih+44:0:44:color=0x111a1c,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=caption.txt:fontsize=12:line_spacing=3:x=5:y=5:fontcolor=white" -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p -movflags +faststart -an "../delivery/$phase-$width.mp4"
              cp "$phase-$width-held.jpg" "../delivery/$phase-$width.jpg"
            done
          done
          cd ../delivery
          for file in *.mp4 *.jpg; do
            sha=$(base64 -w0 "$file" | jq -Rs '{content:.,encoding:"base64"}' | gh api "repos/$GH_REPO/git/blobs" --input - --jq .sha)
            test "$sha" = "$(git hash-object "$file")"
            echo "REVIEW_MEDIA $file $sha $(stat -c %s "$file")"
          done
